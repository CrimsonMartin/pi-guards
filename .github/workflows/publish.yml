name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: [find-guard, trash-guard]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for npm version + git tag verification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install
        working-directory: ${{ matrix.pkg }}
        run: npm install --no-audit --no-fund
      - name: Test
        working-directory: ${{ matrix.pkg }}
        run: npm test
      - name: Verify tag matches package version
        working-directory: ${{ matrix.pkg }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER=${GITHUB_REF_NAME#v}
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::package version $PKG_VER does not match tag v$TAG_VER"
            exit 1
          fi
      - name: Publish
        working-directory: ${{ matrix.pkg }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
