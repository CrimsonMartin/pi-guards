name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required for npm trusted publishing (OIDC)
    strategy:
      fail-fast: false
      matrix:
        pkg: [find-guard, trash-guard]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Set version from tag
        working-directory: ${{ matrix.pkg }}
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER=${VER#v}
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.env.VER;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('version set to', process.env.VER);
          "
      - name: Install and test
        working-directory: ${{ matrix.pkg }}
        run: npm install --no-audit --no-fund && npm test
      - name: Publish (npm trusted publishing / OIDC)
        working-directory: ${{ matrix.pkg }}
        run: npm publish
      - name: Commit version back to main
        working-directory: ${{ matrix.pkg }}
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER=${VER#v}
          if [ -n "$(git status --porcelain package.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore: set version $VER from tag [skip ci]"
            git push origin HEAD:main
          fi
