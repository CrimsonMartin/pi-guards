name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [find-guard, trash-guard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: ${{ matrix.pkg }}
        run: npm install --no-audit --no-fund
      - name: Test
        working-directory: ${{ matrix.pkg }}
        run: npm test
